{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Administrativo | Colegio Amigos</title>
    <!-- CSS Externos (Bootstrap e Íconos) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <!-- CSS Local: Vinculación directa a static_global/portal_staff/css/login_staff.css -->
    <link rel="stylesheet" href="{% static 'portal_staff/css/login_staff.css' %}">
</head>
<body>

    <div class="container d-flex justify-content-center px-3">
        <div class="card login-card">
            
            <div class="login-header">
                <!-- Imagen Local: Vinculación a static_global/portal_staff/img/logo_colegio.png -->
                <img src="{% static 'portal_staff/img/logo_colegio.png' %}" alt="Logo Colegio Amigos" class="logo-img">
                <h4 class="fw-bold mb-0">Colegio Amigos</h4>
                <p class="text-white-50 small mb-0 mt-1 tracking-wide text-uppercase">Portal de Gestión Interna</p>
            </div>

            <div class="card-body p-4 p-md-5 bg-white">

                {% if form.errors %}
                    <div class="alert alert-danger d-flex align-items-center small p-3 mb-4 rounded-3 border-0 bg-danger bg-opacity-10 text-danger" role="alert">
                        <i class="bi bi-shield-lock-fill me-2 fs-5"></i>
                        <div>Acceso denegado. Credenciales incorrectas o sin permisos administrativos.</div>
                    </div>
                {% endif %}

                <form method="post" action="{% url 'login' %}">
                    {% csrf_token %}
                    
                    <div class="mb-4">
                        <label for="id_username" class="form-label text-muted small fw-bold">USUARIO</label>
                        <div class="input-group">
                            <span class="input-group-text border-end-0"><i class="bi bi-person text-muted"></i></span>
                            <input type="text" name="username" class="form-control border-start-0 ps-0 form-control-lg" autofocus autocapitalize="none" autocomplete="username" maxlength="150" required id="id_username" placeholder="Nombre de usuario">
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="id_password" class="form-label text-muted small fw-bold">CONTRASEÑA</label>
                        <div class="input-group">
                            <span class="input-group-text border-end-0"><i class="bi bi-key text-muted"></i></span>
                            <input type="password" name="password" class="form-control border-start-0 ps-0 form-control-lg" autocomplete="current-password" required id="id_password" placeholder="Tu contraseña">
                        </div>
                    </div>
                    
                    <input type="hidden" name="next" value="{{ next }}">
                    
                    <div class="d-grid mt-5">
                        <button type="submit" class="btn btn-custom btn-lg fw-bold rounded-3 shadow-sm">
                            Iniciar Sesión <i class="bi bi-arrow-right ms-2"></i>
                        </button>
                    </div>
                </form>

            </div>
            
            <div class="card-footer bg-light border-0 text-center py-3">
                <small class="text-muted">© 2027 Sistema de Inscripciones</small>
            </div>
        </div>
    </div>

</body>
</html>
