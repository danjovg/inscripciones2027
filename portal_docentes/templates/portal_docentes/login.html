{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Docentes | Colegio Amigos</title>
    <!-- Favicon en la pestaña del navegador -->
    <link rel="icon" type="image/png" href="{% static 'portal_staff/img/logo_colegio.png' %}">
    <link rel="shortcut icon" type="image/png" href="{% static 'portal_staff/img/logo_colegio.png' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body {
            background: linear-gradient(135deg, #eef4f1 0%, #dcebe3 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }
        .login-card {
            border: 0;
            border-radius: 16px;
            box-shadow: 0 15px 45px rgba(20, 108, 67, 0.14);
            overflow: hidden;
            max-width: 430px;
            width: 100%;
        }
        .login-header {
            background: linear-gradient(135deg, #146c43 0%, #0f5132 100%);
            padding: 2.2rem 2rem 1.8rem;
            text-align: center;
            color: #fff;
            border-bottom: 4px solid #20c997;
        }
        .logo-img {
            max-height: 85px;
            width: auto;
            margin-bottom: 0.8rem;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.25));
        }
        .btn-docente {
            background-color: #198754;
            border-color: #198754;
            color: #fff;
            transition: all 0.2s ease;
        }
        .btn-docente:hover {
            background-color: #146c43;
            border-color: #146c43;
            color: #fff;
        }
        .form-control:focus {
            border-color: #198754;
            box-shadow: 0 0 0 0.25rem rgba(25, 135, 84, 0.2);
        }
    </style>
</head>
<body>
    <div class="container d-flex justify-content-center px-3">
        <div class="card login-card">
            <div class="login-header">
                <img src="{% static 'portal_staff/img/logo_colegio.png' %}" alt="Logo Colegio Amigos" class="logo-img">
                <h4 class="fw-bold mb-1">Colegio Evangélico Mixto “Amigos”</h4>
                <span class="badge bg-light text-success fw-bold px-3 py-1 mt-1">
                    <i class="bi bi-whatsapp me-1"></i>PORTAL DOCENTES — DIRECTORIO
                </span>
            </div>

            <div class="card-body p-4 p-md-5 bg-white">
                {% if form.errors %}
                <div class="alert alert-danger d-flex align-items-center small p-3 mb-4 rounded-3 border-0 bg-danger bg-opacity-10 text-danger" role="alert">
                    <i class="bi bi-exclamation-triangle-fill me-2 fs-5"></i>
                    <div>Usuario o contraseña incorrectos, o su cuenta no pertenece al grupo de Docentes.</div>
                </div>
                {% endif %}

                <form method="post" action="{% url 'login' %}">
                    {% csrf_token %}
                    <div class="mb-4">
                        <label for="id_username" class="form-label text-muted small fw-bold">USUARIO DOCENTE</label>
                        <div class="input-group input-group-lg">
                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-person-workspace text-success"></i></span>
                            <input type="text" name="username" class="form-control border-start-0 ps-0" autofocus autocapitalize="none" required id="id_username" placeholder="Ingrese su usuario">
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="id_password" class="form-label text-muted small fw-bold">CONTRASEÑA</label>
                        <div class="input-group input-group-lg">
                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock-fill text-success"></i></span>
                            <input type="password" name="password" class="form-control border-start-0 ps-0" required id="id_password" placeholder="Ingrese su contraseña">
                        </div>
                    </div>

                    <input type="hidden" name="next" value="{{ next }}">

                    <div class="d-grid mt-4">
                        <button type="submit" class="btn btn-docente btn-lg fw-bold rounded-3 shadow-sm">
                            Ingresar al Directorio <i class="bi bi-arrow-right-circle ms-2"></i>
                        </button>
                    </div>
                </form>
            </div>

            <div class="card-footer bg-light border-0 text-center py-3">
                <small class="text-muted"><i class="bi bi-shield-check text-success me-1"></i>Acceso exclusivo de consulta — Ciclo 2027</small>
            </div>
        </div>
    </div>
</body>
</html>
